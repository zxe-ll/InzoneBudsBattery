name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build release package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        shell: pwsh
        run: |
          $dalamudPath = Join-Path $env:RUNNER_TEMP 'dalamud'
          $zipPath = Join-Path $dalamudPath 'latest.zip'
          New-Item -ItemType Directory -Force -Path $dalamudPath | Out-Null
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/goatcorp/dalamud-distrib/main/latest.zip' -OutFile $zipPath
          Expand-Archive -LiteralPath $zipPath -DestinationPath $dalamudPath -Force
          "DALAMUD_HOME=$dalamudPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate release tag and repository metadata
        shell: pwsh
        run: |
          ./scripts/Test-PluginRepository.ps1
          [xml]$project = Get-Content -LiteralPath './src/InzoneBudsBattery/InzoneBudsBattery.csproj' -Raw
          $version = [string]$project.Project.PropertyGroup.AssemblyVersion -replace '\.0$', ''
          if ('${{ github.ref_name }}' -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match project version v$version."
          }

      - name: Restore
        run: dotnet restore InzoneBudsBattery.slnx --locked-mode

      - name: Build
        run: dotnet build InzoneBudsBattery.slnx --configuration Release --no-restore

      - name: Validate release package
        shell: pwsh
        run: ./scripts/Test-PluginRepository.ps1 -PackagePath ./src/InzoneBudsBattery/bin/Release/InzoneBudsBattery/latest.zip

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' './src/InzoneBudsBattery/bin/Release/InzoneBudsBattery/latest.zip' `
            --repo '${{ github.repository }}' `
            --title '${{ github.ref_name }}' `
            --generate-notes
